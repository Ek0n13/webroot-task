services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: article
      POSTGRES_PASSWORD: article_local_only
      POSTGRES_DB: article_intelligence
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U article -d article_intelligence']
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_data:
